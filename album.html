<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>my album</title>
<style>
  :root {
    --blush: #fff0f4;
    --petal: #ffd3df;
    --rose: #f08aa8;
    --berry: #b3305f;
    --ink: #4a1d31;
    --paper: #fffafb;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    color: var(--ink);
    font-family: var(--font);
    background-color: var(--blush);
    background-image:
      radial-gradient(circle at 12% 8%, var(--petal) 0, transparent 38%),
      radial-gradient(circle at 90% 92%, var(--petal) 0, transparent 40%);
    background-attachment: fixed;
  }

  .wrap {
    max-width: 1080px;
    margin: 0 auto;
    padding: 2rem 1.25rem 4rem;
  }

  .back {
    display: inline-block;
    color: var(--berry);
    font-size: 1rem;
    text-decoration: none;
    border-bottom: 2px solid var(--rose);
  }
  .back:hover { color: var(--ink); }
  .back:focus-visible { outline: 3px solid var(--berry); outline-offset: 4px; }

  header {
    text-align: center;
    padding: 2.5rem 0 3rem;
  }

  h1 {
    margin: 0;
    font-weight: 700;
    font-size: clamp(2.2rem, 7vw, 3.5rem);
    line-height: 1.1;
    color: var(--berry);
  }

  .heart {
    display: inline-block;
    color: var(--rose);
    animation: beat 1.6s ease-in-out 3;
  }
  @keyframes beat {
    0%, 100% { transform: scale(1); }
    15% { transform: scale(1.22); }
    30% { transform: scale(1); }
    45% { transform: scale(1.14); }
  }

  .sub {
    margin: 0.75rem 0 0;
    font-size: 1.1rem;
  }

  /* Scrapbook grid */
  .gallery {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 2.5rem 2rem;
    padding: 0;
    margin: 0;
    list-style: none;
  }

  .polaroid {
    position: relative;
    margin: 0;
    padding: 0.9rem 0.9rem 0.4rem;
    background: var(--paper);
    border-radius: 3px;
    box-shadow: 0 10px 24px rgba(179, 48, 95, 0.18), 0 1px 3px rgba(74, 29, 49, 0.15);
    transform: rotate(var(--tilt, 0deg));
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .gallery li:nth-child(4n+1) .polaroid { --tilt: -2.5deg; }
  .gallery li:nth-child(4n+2) .polaroid { --tilt: 1.8deg; }
  .gallery li:nth-child(4n+3) .polaroid { --tilt: -1deg; }
  .gallery li:nth-child(4n+4) .polaroid { --tilt: 2.6deg; }

  /* strip of tape */
  .polaroid::before {
    content: "";
    position: absolute;
    top: -14px;
    left: 50%;
    width: 84px;
    height: 26px;
    transform: translateX(-50%) rotate(-3deg);
    background: rgba(240, 138, 168, 0.55);
  }

  .polaroid button {
    display: block;
    width: 100%;
    padding: 0;
    border: 0;
    background: none;
    cursor: zoom-in;
  }
  .polaroid button:focus-visible { outline: 3px solid var(--berry); outline-offset: 3px; }

  .polaroid img {
    display: block;
    width: 100%;
    aspect-ratio: 4 / 5;
    object-fit: cover;
    background: var(--petal);
  }

  .polaroid figcaption {
    padding: 0.7rem 0.25rem 0.5rem;
    text-align: center;
    font-size: 1rem;
    line-height: 1.3;
    color: var(--berry);
  }

  .polaroid:hover,
  .polaroid:focus-within {
    transform: rotate(0deg) translateY(-6px);
    box-shadow: 0 18px 32px rgba(179, 48, 95, 0.25), 0 1px 3px rgba(74, 29, 49, 0.15);
  }

  /* Full-size viewer */
  dialog {
    max-width: min(92vw, 780px);
    max-height: 92vh;
    padding: 0.9rem 0.9rem 0.4rem;
    border: 0;
    border-radius: 3px;
    background: var(--paper);
    box-shadow: 0 24px 60px rgba(74, 29, 49, 0.4);
    overflow: auto;
  }
  dialog::backdrop { background: rgba(120, 30, 70, 0.55); }
  dialog img {
    display: block;
    max-width: 100%;
    max-height: 72vh;
    margin: 0 auto;
  }
  dialog p {
    margin: 0.6rem 0 0.3rem;
    text-align: center;
    font-size: 1.1rem;
    color: var(--berry);
  }
  dialog .close {
    display: block;
    margin: 0.2rem auto 0.6rem;
    padding: 0.4rem 1.4rem;
    border: 0;
    border-radius: 999px;
    background: var(--berry);
    color: #fff;
    font-family: var(--font);
    font-size: 1rem;
    cursor: pointer;
  }
  dialog .close:hover { background: var(--ink); }
  dialog .close:focus-visible { outline: 3px solid var(--rose); outline-offset: 3px; }

  footer {
    margin-top: 4rem;
    text-align: center;
    font-size: 1rem;
    color: var(--berry);
  }

  @media (prefers-reduced-motion: reduce) {
    .heart { animation: none; }
    .polaroid { transition: none; }
  }

  @media (max-width: 520px) {
    .gallery { grid-template-columns: 1fr 1fr; gap: 2rem 1rem; }
    .polaroid { padding: 0.55rem 0.55rem 0.2rem; }
    .polaroid figcaption { font-size: 0.9rem; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="index.html">Back to home</a>

    <header>
      <h1> sorry but i have to<span class="heart" aria-hidden="true">&hearts;</span></h1>
      <p class="sub">"amel suggestion"</p>
    </header>

    <!-- To add a photo: copy one <li> block, then change src, alt and the caption. -->
    <ul class="gallery">
      <li>
        <figure class="polaroid">
          <button type="button" data-full>
            <img src="images/08_10_2026 8_22_38 pm.png" alt="Photo 1" loading="lazy">
          </button>
          <figcaption>First ever pic with edited cat ears</figcaption>
        </figure>
      </li>
      <li>
        <figure class="polaroid">
          <button type="button" data-full>
            <img src="images/64fd3532aa4b19284bc15311c84606c0_0.webp" alt="Photo 2" loading="lazy">
          </button>
          <figcaption>Newly pic of me on cat filter on tiktok</figcaption>
        </figure>
      </li>
      <li>
        <figure class="polaroid">
          <button type="button" data-full>
            <img src="images/image.png" alt="Photo 3" loading="lazy">
          </button>
          <figcaption>My friend edited this to me when we still plaing minecraft</figcaption>
        </figure>
      </li>
      <li>
        <figure class="polaroid">
          <button type="button" data-full>
            <img src="images/Screenshot 2026-08-26 012644.png" alt="Photo 4" loading="lazy">
          </button>
          <figcaption>corpse makeup</figcaption>
        </figure>
      </li>
      <li>
        <figure class="polaroid">
          <button type="button" data-full>
            <img src="images/Snapchat-256539495.jpg" alt="Photo 5" loading="lazy">
          </button>
          <figcaption>A freaking snapchat filet MMMMDDRRR</figcaption>
        </figure>
      </li>
      <li>
        <figure class="polaroid">
          <button type="button" data-full>
            <img src="images/watermark-a5ea5c2e66bc5966cffd7ff82483b096_0.jpeg" alt="Photo 6" loading="lazy">
          </button>
          <figcaption>ahh.. hol on this is not right?</figcaption>
        </figure>
      </li>
    </ul>

    <footer>thanks for amel &hearts;</footer>
  </div>

  <dialog id="viewer" aria-label="Photo viewer">
    <img id="viewer-img" src="" alt="">
    <p id="viewer-caption"></p>
    <button type="button" class="close" id="viewer-close">Close</button>
  </dialog>

  <script>
    const viewer = document.getElementById("viewer");
    const viewerImg = document.getElementById("viewer-img");
    const viewerCaption = document.getElementById("viewer-caption");

    document.querySelectorAll("[data-full]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        const img = btn.querySelector("img");
        viewerImg.src = img.src;
        viewerImg.alt = img.alt;
        viewerCaption.textContent = btn.parentElement.querySelector("figcaption").textContent;
        viewer.showModal();
      });
    });

    document.getElementById("viewer-close").addEventListener("click", function () {
      viewer.close();
    });

    // Click outside the photo card to close
    viewer.addEventListener("click", function (e) {
      if (e.target === viewer) viewer.close();
    });
  </script>
</body>
</html>
